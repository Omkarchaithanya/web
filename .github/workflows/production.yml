


name: Production CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
      - name: Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm install
      - name: Build Frontend
        working-directory: ./Frontend
        run: npm run build

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: urbantree_test
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
      - name: Install Backend Dependencies
        working-directory: ./Backend
        run: npm install
      - name: Generate Prisma Client
        working-directory: ./Backend
        run: npx prisma generate
      - name: Run Backend Tests
        working-directory: ./Backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/urbantree_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test-secret
          JWT_REFRESH_SECRET: test-secret
          IOT_API_KEY: test-key-123456789012345678901234
        run: npm run test

  docker-build:
    needs: [build-frontend, test-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Test Docker Compose Build
        run: docker-compose build
