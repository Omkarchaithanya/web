services:
  postgres:
    image: postgres:16-alpine
    container_name: urbantree-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: urbantree
      POSTGRES_PASSWORD: urbantree_secret
      POSTGRES_DB: urbantree
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbantree -d urbantree"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: urbantree-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urbantree-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://urbantree:urbantree_secret@postgres:5432/urbantree?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      IOT_API_KEY: ${IOT_API_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8000}
    volumes:
      - ./logs:/app/logs

volumes:
  postgres_data:
  redis_data:
